# Default values for myapp.
# Keep this file environment-neutral: safe defaults only.
# Per-environment overrides live in environments/<env>/myapp.values.yaml.

replicaCount: 1

image:
  repository: nginx
  # Empty = use .Chart.AppVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: false
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

containerPort: 80

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""

# Plain (non-secret) environment variables
env:
  LOG_LEVEL: info

# Name of an existing Secret to load as env vars (never put secrets in values)
existingSecret: ""

# Rendered into a ConfigMap and mounted at /etc/myapp/app.conf
config:
  enabled: true

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

# Pre-install/pre-upgrade Job (e.g. DB migrations)
migrations:
  enabled: false
  command:
    - /bin/sh
    - -c
    - echo "running migrations"

nodeSelector: {}
tolerations: []
affinity: {}
