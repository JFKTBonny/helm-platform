# Deploys ONE app with plain Helm (simple case).
# For a whole environment (platform + apps) use the "Helmfile" workflow instead.
name: Deploy (Helm)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      image_tag:
        description: Optional image tag override (empty = value from environments/<env>)
        required: false
        type: string

env:
  HELM_VERSION: v4.3.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Add required reviewers for "prod" under Settings > Environments
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-myapp-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure kubeconfig
        env:
          # One environment secret named KUBECONFIG in each GitHub environment
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_CONTENT" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config current-context

      - name: Deploy myapp
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            EXTRA_ARGS+=(--set-string "image.tag=${{ inputs.image_tag }}")
          fi

          helm upgrade --install myapp ./charts/myapp \
            --namespace "myapp-${{ inputs.environment }}" \
            --create-namespace \
            -f "environments/${{ inputs.environment }}/myapp.values.yaml" \
            "${EXTRA_ARGS[@]}" \
            --wait \
            --rollback-on-failure \
            --timeout 5m \
            --history-max 10

      - name: Run chart tests
        run: helm test myapp -n "myapp-${{ inputs.environment }}"
