{{- $email := required "email is required" .Values.email }}
{{- range .Values.issuers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .name }}
spec:
  acme:
    email: {{ $email }}
    server: {{ .server }}
    privateKeySecretRef:
      name: {{ .name }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ $.Values.ingressClass }}
{{- end }}
